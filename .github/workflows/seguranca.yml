name: seguranca

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencias:
    name: Dependencias com vulnerabilidades conhecidas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Instalar as versoes do lock sem scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Bloquear vulnerabilidades altas ou criticas
        run: npm audit --omit=dev --audit-level=high

  segredos:
    name: Segredos nos ficheiros atuais
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-8.30.1"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
      - name: Bloquear segredos sem os mostrar nos logs
        shell: bash
        run: |
          "${RUNNER_TEMP}/gitleaks-8.30.1/gitleaks" dir \
            --config=.gitleaks.toml --redact=100 --exit-code=1 .
