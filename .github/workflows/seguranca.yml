name: verificacoes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A1 do catalogo: procura segredos em todos os commits, com fetch-depth 0.
  # O grupo ainda nao tem uma politica de dependencias, por isso A2 nao se aplica.
  segredos:
    name: Segredos no historico Git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preparar Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-8.30.1"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
      - name: Bloquear segredos sem os mostrar nos logs
        shell: bash
        run: |
          "${RUNNER_TEMP}/gitleaks-8.30.1/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --redact --no-banner --exit-code 1

  # A3 do catalogo: PS-03 proibe concatenar ou interpolar valores nas queries.
  analise_estatica:
    name: PS-03 — Análise estática das consultas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Semgrep
        run: pip install semgrep
      - name: Aplicar as regras PS-03 ao codigo
        run: semgrep --config .semgrep/ --error --metrics=off src/

  # B1 do catalogo: garante as regras da PS-01 — Autenticação.
  ps01_autenticacao:
    name: PS-01 — Autenticação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Instalar as versoes do lock sem scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Verificar a PS-01
        run: npm test -- --test-name-pattern="PS-01"

  # B2 do catalogo: impede IDOR e acesso a encomendas alheias (PS-02).
  ps02_autorizacao:
    name: PS-02 — Autorização de encomendas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Instalar as versoes do lock sem scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Verificar a PS-02
        run: npm test -- --test-name-pattern="PS-02"

  # B4 do catalogo: rejeita IDs inválidos antes das consultas (PS-03).
  ps03_validacao:
    name: PS-03 — Validação e consultas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Instalar as versoes do lock sem scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Verificar a PS-03
        run: npm test -- --test-name-pattern="PS-03"

  # Job criado para o grupo: o catálogo não tem um teste específico de JWT.
  ps04_tokens:
    name: PS-04 — Gestão de tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Instalar as versoes do lock sem scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Verificar a PS-04 e o segredo de configuração
        run: npm test -- --test-name-pattern="PS-04|JWT_SECRET"
